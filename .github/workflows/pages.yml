name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; se chegar push novo no meio, o antigo é descartado.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Se a conta quebrar, é melhor o deploy falhar do que publicar errado.
      - run: npm run test
      - run: npm run type-check

      - run: npm run build
        env:
          GITHUB_PAGES: '1'

      # SPA: qualquer rota cai no index.html. Hoje só existe uma tela, mas isso
      # evita 404 quando as próximas páginas entrarem.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
